server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Subida de folios: un modulo 5 escaneado pesa. El limite real lo impone la
    # API (25 MB por archivo); aqui solo se deja pasar con holgura.
    client_max_body_size 32m;

    # El frontend habla contra /api en el mismo origen: no hay CORS que
    # configurar ni URL de backend que cambiar entre entornos.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
