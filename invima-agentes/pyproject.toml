[project]
name = "invima-a1"
version = "0.1.0"
description = "Sistema de agentes para el tramite de Registro Sanitario de Molecula - INVIMA"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    # Extraccion de la capa de texto de los folios PDF del expediente.
    "pypdf>=5.1",
]

[project.optional-dependencies]
gemini = ["google-genai>=0.3"]
ocr = ["docling>=2.0"]
fixtures = ["reportlab>=4.2"]
dev = ["pytest>=8.3", "pytest-cov>=5.0"]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "python-multipart>=0.0.12",
]

[project.scripts]
invima-a1 = "invima_a1.adaptadores.entrada.cli:main"
invima-a2 = "invima_a2.adaptadores.entrada.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invima_a1", "src/invima_api", "src/invima_nucleo", "src/invima_a3", "src/invima_a4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
